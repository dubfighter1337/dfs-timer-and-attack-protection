plugins { id 'java' }

group = 'com.dfsready'
version = '0.1.0'

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = '1.12.39'
dependencies {
    compileOnly "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    // Local verification files are not included in the downloadable plugin source.
    if (!fileTree('src/test/java').matching { include '**/*Test.java' }.isEmpty()) {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-inline:4.11.0'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
test { systemProperty 'java.awt.headless', 'true' }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dfsready.DfsReadyLauncher'
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
}
tasks.register('launcherSmoke', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.dfsready.DfsReadyLauncher'
    args '--help'
    jvmArgs '-ea'
}
